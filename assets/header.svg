<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Weihao Cheng — Medical AI, Multimodal Learning, Agentic Reasoning</title>
<desc id="desc">A pale blue research banner with cyan and violet orbital lines and an animated signal.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF4FF"/></linearGradient><linearGradient id="accent"><stop stop-color="#0891B2"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="glow"><stop stop-color="#DBEAFE" stop-opacity=".8"/><stop offset="1" stop-color="#F8FBFF" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#64748B" stroke-opacity=".07"/></pattern></defs>
<style>.signal{stroke-dasharray:80 460;animation:flow 6s linear infinite}.orbit{transform-origin:1015px 175px;animation:rotate 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-540}}@keyframes rotate{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.signal,.orbit{animation:none}}</style>
<rect width="1200" height="350" rx="22" fill="url(#bg)"/><rect width="1200" height="350" rx="22" fill="url(#grid)"/><circle cx="980" cy="170" r="250" fill="url(#glow)"/>
<rect x="48" y="46" width="32" height="3" rx="1.5" fill="#0891B2"/><text x="94" y="53" font-family="monospace" font-size="13" letter-spacing="3" fill="#64748B">VHOCHENG / RESEARCH &amp; CODE</text>
<text x="48" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#172554">Weihao Cheng</text>
<text x="50" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#334155">Medical AI · Multimodal Learning · Agentic Reasoning</text>
<text x="50" y="242" font-family="monospace" font-size="15" fill="#0891B2">HANGZHOU DIANZI UNIVERSITY</text>
<text x="50" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748B">From multimodal signals to clinically meaningful intelligence.</text>
<g fill="none" stroke="url(#accent)" opacity=".48"><circle cx="1015" cy="175" r="112"/><circle cx="1015" cy="175" r="76" stroke-dasharray="3 8"/><ellipse cx="1015" cy="175" rx="140" ry="48" transform="rotate(-38 1015 175)"/><ellipse cx="1015" cy="175" rx="140" ry="48" transform="rotate(38 1015 175)"/></g>
